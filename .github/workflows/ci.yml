name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This repo carries BOTH package-lock.json and pnpm-lock.yaml, and the two
      # are consumed by different systems: CI installs with `npm ci` above,
      # while Vercel detects pnpm-lock.yaml and installs with pnpm
      # --frozen-lockfile. So a dependency change made with only one package
      # manager leaves the other lockfile stale — CI goes green and the deploy
      # fails. That is not hypothetical; it happened on PR #59, where packages
      # removed via npm stayed listed in pnpm-lock.yaml.
      #
      # This step reproduces Vercel's check cheaply: --lockfile-only resolves
      # without downloading anything, and --frozen-lockfile makes it FAIL rather
      # than silently repair a lockfile that disagrees with package.json.
      #
      # Better still would be to keep one package manager. Until that decision
      # is made, this stops the gap being invisible.
      - name: Verify pnpm lockfile matches package.json (Vercel installs with pnpm)
        run: |
          # `corepack enable` alone downloads the LATEST pnpm, which broke this
          # job the first time it ran: pnpm 11 requires Node >= 22.13 and imports
          # node:sqlite, so on the Node 20 pinned above it died with
          # ERR_UNKNOWN_BUILTIN_MODULE. The version has to be pinned.
          #
          # It is pinned once, in package.json's "packageManager" field, which
          # corepack reads here and Vercel reads at deploy time — so CI and the
          # deploy now agree on the exact pnpm build, and it is the same one
          # that wrote pnpm-lock.yaml (lockfileVersion 9.0).
          corepack enable
          corepack pnpm install --frozen-lockfile --lockfile-only

      - name: Typecheck
        # `next build` typechecks too, but only after everything else has run.
        # Failing here turns a 20-minute red build into a 30-second one.
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
