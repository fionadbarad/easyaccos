# Actions are pinned to commit SHAs rather than tags, for the reason set out at
# the top of security.yml: a tag can be silently repointed by its owner. Semgrep
# only flagged the security workflow (it scans the diff), but the exposure is the
# same class here and a half-pinned repository is not a pinned one. The trailing
# `# v4` comments are how Dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack ships with Node and reads the exact pnpm build from
      # package.json's "packageManager" field — the same one Vercel reads at
      # deploy time. Enabling it before setup-node lets `cache: 'pnpm'` find the
      # store. Deliberately NOT pnpm/action-setup: that is a third-party action
      # which would need SHA-pinning and Dependabot watching, to do something
      # Node already does.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # --frozen-lockfile fails rather than silently repairing a lockfile that
      # disagrees with package.json. This is exactly what Vercel runs, so CI now
      # resolves the same dependency tree that gets deployed.
      #
      # This replaced `npm ci` plus a separate step that re-checked the pnpm
      # lockfile, which existed only because the repo carried BOTH lockfiles and
      # they could drift apart — CI green, deploy broken, as happened on #59.
      # One lockfile makes the whole class of problem unrepresentable, so the
      # guard step is gone rather than kept as decoration.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # `next build` typechecks too, but only after everything else has run.
        # Failing here turns a 20-minute red build into a 30-second one.
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
